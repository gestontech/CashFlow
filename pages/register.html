<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — CashFlow</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="section"><div class="heading"><span class="label">CASHFLOW</span><h2>Commencer gratuitement</h2><p>Créez votre espace CashFlow.</p></div><form class="card" style="max-width:480px;margin:auto" onsubmit="return false"><label>Nom</label><input required placeholder="Votre nom" style="width:100%;padding:14px;margin:8px 0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text)"><label>Email</label><input required type="email" placeholder="vous@exemple.com" style="width:100%;padding:14px;margin:8px 0 16px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text)"><label>Mot de passe</label><input required type="password" placeholder="••••••••" style="width:100%;padding:14px;margin:8px 0 20px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text)"><button class="btn primary" style="width:100%">Créer mon compte</button><p>Déjà inscrit ? <a href="login.html">Se connecter</a></p></form></main></body></html>
