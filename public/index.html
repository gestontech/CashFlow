<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="CashFlow — gestion commerciale professionnelle">
  <title>CashFlow</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>

<body>

<div id="app">

  <!-- AUTHENTIFICATION -->
  <section id="authView" class="auth-shell">

    <div class="auth-card glass">

      <div class="brand">
        <span class="logo">C</span>

        <div>
          <strong>CashFlow</strong>
          <small>Gestion commerciale</small>
        </div>
      </div>

      <div class="auth-intro">
        <span class="eyebrow">CASHFLOW</span>
        <h1>Gérez votre activité simplement.</h1>
        <p>
          Produits, ventes, stock, clients, dettes et rapports
          dans une seule application.
        </p>
      </div>

      <div class="tabs">
        <button
          type="button"
          class="active"
          data-auth="login"
        >
          Connexion
        </button>

        <button
          type="button"
          data-auth="register"
        >
          Créer un compte
        </button>
      </div>

      <!-- CONNEXION -->
      <form id="loginForm" class="auth-form">

        <label>
          E-mail
          <input
            name="email"
            type="email"
            autocomplete="email"
            placeholder="vous@example.com"
            required
          >
        </label>

        <label>
          Mot de passe
          <input
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
          >
        </label>

        <button
          type="submit"
          class="primary"
        >
          Se connecter
        </button>

      </form>

      <!-- INSCRIPTION -->
      <form
        id="registerForm"
        class="auth-form hidden"
      >

        <label>
          Nom complet
          <input
            name="name"
            autocomplete="name"
            placeholder="Votre nom"
            required
          >
        </label>

        <label>
          E-mail
          <input
            name="email"
            type="email"
            autocomplete="email"
            placeholder="vous@example.com"
            required
          >
        </label>

        <label>
          Téléphone
          <input
            name="phone"
            autocomplete="tel"
            placeholder="243..."
          >
        </label>

        <label>
          Nom de la boutique
          <input
            name="shop_name"
            placeholder="Ma boutique"
          >
        </label>

        <label>
          Mot de passe
          <input
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            placeholder="Minimum 8 caractères"
            required
          >
        </label>

        <button
          type="submit"
          class="primary"
        >
          Créer mon compte
        </button>

      </form>

      <p
        id="authMessage"
        class="message"
      ></p>

      <div class="support">
        <span>Besoin d'aide ?</span>
        <a
          id="waAuth"
          href="#"
          target="_blank"
          rel="noopener"
        >
          WhatsApp
        </a>
        <span>·</span>
        <a
          id="mailAuth"
          href="#"
        >
          E-mail
        </a>
      </div>

    </div>

  </section>


  <!-- APPLICATION -->
  <section
    id="appView"
    class="hidden"
  >

    <!-- SIDEBAR -->
    <aside class="sidebar glass">

      <div class="brand">

        <span class="logo">C</span>

        <div>
          <strong>CashFlow</strong>
          <small id="shopLabel">Ma boutique</small>
        </div>

      </div>


      <nav id="nav">

        <!-- TABLEAU DE BORD -->
        <button
          type="button"
          class="active"
          data-page="dashboard"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3.5 10.5 12 3l8.5 7.5"/>
              <path d="M5.5 9.5V20h13V9.5"/>
              <path d="M9.5 20v-6h5v6"/>
            </svg>
          </span>
          <span>Tableau de bord</span>
        </button>


        <!-- PRODUITS -->
        <button
          type="button"
          data-page="products"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/>
              <path d="m4.5 7.5 7.5 4 7.5-4"/>
              <path d="M12 11.5V21"/>
            </svg>
          </span>
          <span>Produits & stock</span>
        </button>


        <!-- VENTES -->
        <button
          type="button"
          data-page="sales"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M5 19 19 5"/>
              <path d="M10 5h9v9"/>
              <path d="M4 5h2"/>
              <path d="M4 9h2"/>
              <path d="M4 13h2"/>
              <path d="M4 17h2"/>
            </svg>
          </span>
          <span>Ventes</span>
        </button>


        <!-- CLIENTS -->
        <button
          type="button"
          data-page="customers"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="3.2"/>
              <path d="M5.5 20c.7-3.3 3-5 6.5-5s5.8 1.7 6.5 5"/>
              <path d="M18 5.5c1.2.4 2 1.4 2 2.7"/>
              <path d="M19.5 13.5c1.1.7 1.8 1.8 2 3"/>
            </svg>
          </span>
          <span>Clients</span>
        </button>


        <!-- DETTES -->
        <button
          type="button"
          data-page="debts"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="8.5"/>
              <path d="M12 7v5l3.2 2"/>
            </svg>
          </span>
          <span>Dettes</span>
        </button>


        <!-- RAPPORTS -->
        <button
          type="button"
          data-page="reports"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 19V5"/>
              <path d="M4 19h16"/>
              <path d="M7 15v-3"/>
              <path d="M11 15V8"/>
              <path d="M15 15v-5"/>
              <path d="M19 15V6"/>
            </svg>
          </span>
          <span>Rapports</span>
        </button>


        <!-- ABONNEMENT -->
        <button
          type="button"
          data-page="subscription"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m12 3 2.1 4.3 4.7.7-3.4 3.3.8 4.7-4.2-2.2-4.2 2.2.8-4.7-3.4-3.3 4.7-.7L12 3Z"/>
              <path d="M8 18h8"/>
              <path d="M9.5 21h5"/>
            </svg>
          </span>
          <span>Abonnement</span>
        </button>


        <!-- PROFIL -->
        <button
          type="button"
          data-page="profile"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1A1.7 1.7 0 0 0 8 15a1.7 1.7 0 0 0-1.5-1H6.3v-2.6h.2A1.7 1.7 0 0 0 8 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.6v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"/>
            </svg>
          </span>
          <span>Mon profil</span>
        </button>


        <!-- ADMINISTRATION -->
        <button
          type="button"
          data-page="admin"
          id="adminNav"
          class="hidden"
        >
          <span class="nav-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 3 5 6v5c0 4.4 2.8 8.3 7 10 4.2-1.7 7-5.6 7-10V6l-7-3Z"/>
              <path d="m9.5 12 1.7 1.7 3.5-3.7"/>
            </svg>
          </span>
          <span>Administration</span>
        </button>

      </nav>


      <div class="sidebar-bottom">

        <a
          id="waLink"
          href="#"
          target="_blank"
          rel="noopener"
        >
          WhatsApp support
        </a>

        <a
          id="mailLink"
          href="#"
        >
          gestontech@gmail.com
        </a>

        <button
          id="logout"
          type="button"
          class="ghost"
        >
          Se déconnecter
        </button>

      </div>

    </aside>


    <!-- CONTENU PRINCIPAL -->
    <main class="main">

      <header class="topbar glass">

        <div class="topbar-title">

          <span class="eyebrow">CASHFLOW</span>

          <h1 id="pageTitle">
            Tableau de bord
          </h1>

        </div>

        <div class="actions">

          <button
            id="themeBtn"
            type="button"
            class="icon"
            title="Changer le thème"
            aria-label="Changer le thème"
          >
            ◐
          </button>

          <button
            id="avatarBtn"
            type="button"
            class="avatar"
            title="Mon profil"
            aria-label="Mon profil"
          >
            C
          </button>

        </div>

      </header>


      <div
        id="content"
        class="content"
      ></div>

    </main>

  </section>

</div>


<script src="/assets/app.js"></script>
<script src="/assets/receipt.js"></script>

</body>
</html>
